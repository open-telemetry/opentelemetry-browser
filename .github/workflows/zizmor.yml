name: Security Analysis with zizmor

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@f73c28e3be66444181acb54f07ada23f144c0c39 # v0.25.0
