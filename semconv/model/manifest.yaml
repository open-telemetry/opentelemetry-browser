name: opentelemetry-browser
description: Local semantic conventions for opentelemetry-browser.
schema_url: https://opentelemetry.io/schemas/opentelemetry-browser/0.1.0
# The upstream dependency tracks whichever semantic-conventions release defines the groups that
# events.yaml imports, which is independent of the `@opentelemetry/semantic-conventions` range the
# packages depend on at runtime. It has to be at least v1.44.0: events.yaml imports the
# `browser.web_vital` group, and v1.43.0 ships the `browser.web_vital` event name without any of
# the `browser.web_vital.*` attributes.
dependencies:
  - name: otel
    registry_path: https://github.com/open-telemetry/semantic-conventions@v1.44.0[model]
    schema_url: https://opentelemetry.io/schemas/1.44.0
